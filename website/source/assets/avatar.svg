<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Maya, LegalGraph AI assistant" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#e7ecf7"/>
      <stop offset="1" stop-color="#b7c4e0"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3427"/>
      <stop offset="1" stop-color="#2c1e15"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.42" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#f3d3ba"/>
      <stop offset="0.6" stop-color="#e9bd9e"/>
      <stop offset="1" stop-color="#d4a480"/>
    </radialGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3958"/>
      <stop offset="1" stop-color="#1c2740"/>
    </linearGradient>
    <linearGradient id="blouse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcff"/>
      <stop offset="1" stop-color="#dfe4ef"/>
    </linearGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8927a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e8927a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.34" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>

  <!-- shoulders / blazer -->
  <path d="M35 500 C50 380 120 335 200 335 C280 335 350 380 365 500 Z" fill="url(#blazer)"/>
  <path d="M150 340 L200 420 L250 340 L232 330 L200 372 L168 330 Z" fill="url(#blouse)"/>
  <path d="M35 500 C50 380 120 335 200 335 L200 500 Z" fill="#000000" opacity="0.08"/>

  <!-- neck -->
  <path d="M170 300 L170 360 Q200 380 230 360 L230 300 Z" fill="#e2ad8d"/>
  <path d="M170 300 L170 335 Q200 352 230 335 L230 300 Z" fill="#00000012"/>

  <!-- hair back -->
  <path d="M112 205 C104 300 118 345 150 372 C130 300 132 230 150 190 Z" fill="url(#hair)"/>
  <path d="M288 205 C296 300 282 345 250 372 C270 300 268 230 250 190 Z" fill="url(#hair)"/>

  <!-- head -->
  <ellipse cx="200" cy="205" rx="88" ry="98" fill="url(#skin)"/>

  <!-- ears -->
  <ellipse cx="115" cy="212" rx="12" ry="20" fill="#e2ad8d"/>
  <ellipse cx="285" cy="212" rx="12" ry="20" fill="#e2ad8d"/>

  <!-- hair front / style -->
  <path d="M112 190 C108 120 150 78 200 78 C250 78 292 120 288 190
           C288 150 268 108 200 106 C132 108 112 150 112 190 Z" fill="url(#hair)"/>
  <path d="M118 175 C124 128 158 96 200 96 C168 100 140 130 132 178 Z" fill="#5b4534" opacity="0.6"/>
  <path d="M282 175 C276 128 242 96 200 96 C232 100 260 130 268 178 Z" fill="#5b4534" opacity="0.6"/>

  <!-- cheeks -->
  <ellipse cx="150" cy="235" rx="26" ry="18" fill="url(#cheek)"/>
  <ellipse cx="250" cy="235" rx="26" ry="18" fill="url(#cheek)"/>

  <!-- eyebrows -->
  <path d="M140 178 Q160 168 182 176" stroke="#4a3427" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M218 176 Q240 168 260 178" stroke="#4a3427" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- eyes group (blinks via CSS) -->
  <g id="eyes">
    <ellipse cx="163" cy="200" rx="15" ry="9" fill="#fff"/>
    <circle cx="164" cy="200" r="6.4" fill="#5a3c28"/>
    <circle cx="164" cy="200" r="2.6" fill="#1a120c"/>
    <circle cx="161" cy="197" r="1.6" fill="#fff" opacity="0.9"/>
    <path d="M148 200 Q163 189 178 200" stroke="#2c1e15" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <ellipse cx="237" cy="200" rx="15" ry="9" fill="#fff"/>
    <circle cx="236" cy="200" r="6.4" fill="#5a3c28"/>
    <circle cx="236" cy="200" r="2.6" fill="#1a120c"/>
    <circle cx="233" cy="197" r="1.6" fill="#fff" opacity="0.9"/>
    <path d="M222 200 Q237 189 252 200" stroke="#2c1e15" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>
  <g id="eyelids" opacity="0">
    <path d="M148 200 Q163 197 178 200 L178 203 Q163 200 148 203 Z" fill="#e9bd9e"/>
    <path d="M222 200 Q237 197 252 200 L252 203 Q237 200 222 203 Z" fill="#e9bd9e"/>
  </g>

  <!-- nose -->
  <path d="M198 205 C196 220 192 232 188 238 C194 244 206 244 212 238 C208 232 204 220 202 205 Z"
        fill="#dba57f" opacity="0.7"/>

  <!-- mouth (animated by widget.js while speaking) -->
  <g id="mouth" transform="translate(200,262)">
    <path id="mouthShape" d="M-24 0 Q0 8 24 0 Q0 4 -24 0 Z" fill="#9c4a42"/>
    <path d="M-22 -1 Q0 -6 22 -1" stroke="#7a352f" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- subtle jaw shading -->
  <path d="M130 250 Q200 300 270 250 Q250 290 200 295 Q150 290 130 250 Z" fill="#00000008"/>

  <rect width="400" height="500" fill="url(#vign)"/>
</svg>
